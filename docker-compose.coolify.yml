# Coolify-specific compose file (git-sourced Application, build_pack=dockercompose).
#
# Coolify clones the repo on deploy and runs this file. It differs from the
# Dokploy-era setup in exactly one structural way: the Postgres and MinIO
# volumes are `external: true`, pointing at the named volumes that already hold
# the live data (created under the old Dokploy app name). That is what makes
# switching deployment tooling a redeploy rather than a data migration.
#
# Env vars are `${VAR}` placeholders that Coolify surfaces as editable
# variables on the resource; values live in Coolify, never in this file.

services:
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://ppp:${DB_PASSWORD}@db:5432/ppp?schema=public
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_NAME: ${ADMIN_NAME}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ppp:${DB_PASSWORD}@db:5432/ppp?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-ppp-models}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ppp}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-print.cody.onl}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:-BYD Printing}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_NAME: ${ADMIN_NAME}
      MAIL_FROM: ${MAIL_FROM}
      SMTP_URL: ${SMTP_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      HIBP_DISABLED: ${HIBP_DISABLED:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      WEBHOOK_URL: ${WEBHOOK_URL}
    expose:
      - 3000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ppp
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ppp
    volumes:
      - ppp_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppp -d ppp"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # MinIO's OSS images were removed from Docker Hub (Sep 2026) and quay.io
    # now rejects anonymous pulls ("unauthorized"). This is the last working
    # release, preserved in the owner's GHCR registry so deploys don't depend
    # on a registry that no longer serves it anonymously. See also the note in
    # docs/deployment.md about evaluating a maintained S3-compatible
    # alternative before MinIO's OSS line becomes unsupported.
    image: ghcr.io/imvylo/byd-minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ppp}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - ppp_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ppp_db_data:
    external: true
    name: print-cody-onl-bc0dqh_ppp_db_data
  ppp_minio_data:
    external: true
    name: print-cody-onl-bc0dqh_ppp_minio_data
