# Coolify-specific compose file (git-sourced Application, build_pack=dockercompose).
#
# Coolify clones the repo on deploy and runs this file. It differs from the
# self-host compose in one way: the Postgres and model-store volumes are
# `external: true`, pointing at named volumes that hold the live data (created
# under the old Dokploy app name) — so switching deployment tooling was a
# redeploy rather than a data migration.
#
# Storage is the filesystem now, not MinIO: model bytes live under
# MODELS_ROOT (mounted at /uploads) in a persistent volume. The old MinIO
# volume (`print-cody-onl-bc0dqh_ppp_minio_data`) still holds the pre-migration
# model files and should be copied into the models volume before it is retired.
#
# Env vars are `${VAR}` placeholders that Coolify surfaces as editable
# variables on the resource; values live in Coolify, never in this file.

services:
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://ppp:${DB_PASSWORD}@db:5432/ppp?schema=public
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_NAME: ${ADMIN_NAME}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ppp:${DB_PASSWORD}@db:5432/ppp?schema=public
      MODELS_ROOT: /uploads
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-print.cody.onl}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:-BYD Printing}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_NAME: ${ADMIN_NAME}
      MAIL_FROM: ${MAIL_FROM}
      SMTP_URL: ${SMTP_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      HIBP_DISABLED: ${HIBP_DISABLED:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      WEBHOOK_URL: ${WEBHOOK_URL}
    volumes:
      - ppp_models_data:/uploads
    expose:
      - 3000
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ppp
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ppp
    volumes:
      - ppp_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppp -d ppp"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ppp_db_data:
    external: true
    name: print-cody-onl-bc0dqh_ppp_db_data
  ppp_models_data:
    external: true
    name: print-cody-onl-bc0dqh_ppp_models_data
